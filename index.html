<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>스마트 학원 출결 시스템</title>
    <style>
        :root {
            --primary-color: #4A90E2;
            --success-color: #47C96B;
            --danger-color: #F45B5B;
            --text-color: #2D3436;
        }

        body {
            font-family: 'Pretendard', -apple-system, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            display: flex; justify-content: center; align-items: center;
            height: 100vh; margin: 0; overflow: hidden;
        }

        .keypad-container {
            background: white; padding: 40px; border-radius: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.15);
            width: 400px; text-align: center; position: relative;
        }

        .student-info {
            height: 40px; margin-bottom: 10px; font-size: 20px;
            font-weight: 700; color: var(--primary-color);
        }

        .display {
            background: #F1F3F5; height: 80px; border-radius: 20px;
            margin-bottom: 30px; display: flex; justify-content: center;
            align-items: center; font-size: 40px; font-weight: 800;
            letter-spacing: 15px; color: var(--text-color);
            border: 2px solid #E9ECEF;
        }

        .grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px;
        }

        button {
            height: 80px; border: none; border-radius: 20px;
            background: #fff; box-shadow: 0 5px 0 #eee;
            font-size: 28px; font-weight: 700; cursor: pointer;
            transition: all 0.1s; border: 1px solid #eee; color: #495057;
        }

        button:active { transform: translateY(3px); box-shadow: none; background: #F8F9FA; }

        .btn-clear { color: var(--danger-color); }
        .btn-ok { 
            background: var(--primary-color); color: white; 
            grid-column: span 2; box-shadow: 0 5px 0 #357ABD;
        }
        .btn-ok:active { background: #357ABD; box-shadow: none; }
        
        #status {
            margin-top: 25px; font-size: 16px; font-weight: 500; height: 20px;
        }

        .loading-spinner {
            display: none; border: 4px solid #f3f3f3; border-top: 4px solid var(--primary-color);
            border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite;
            margin: 10px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="keypad-container">
    <div id="studentName" class="student-info">반갑습니다!</div>
    <div class="display" id="display">----</div>
    
    <div class="grid">
        <button onclick="addNum('1')">1</button>
        <button onclick="addNum('2')">2</button>
        <button onclick="addNum('3')">3</button>
        <button onclick="addNum('4')">4</button>
        <button onclick="addNum('5')">5</button>
        <button onclick="addNum('6')">6</button>
        <button onclick="addNum('7')">7</button>
        <button onclick="addNum('8')">8</button>
        <button onclick="addNum('9')">9</button>
        <button class="btn-clear" onclick="clearNum()">C</button>
        <button onclick="addNum('0')">0</button>
        <button class="btn-ok" onclick="submitAttendance()">확인</button>
    </div>
    
    <div id="status">데이터 로딩 중...</div>
    <div id="spinner" class="loading-spinner"></div>
</div>

<script>
    let input = "";
    let studentData = {};
    const display = document.getElementById('display');
    const status = document.getElementById('status');
    const studentNameDiv = document.getElementById('studentName');
    const spinner = document.getElementById('spinner');

    // --- 여기를 원장님의 정보로 수정하세요 ---
    const API_TOKEN = "afca6237-6cf7-4792-96d6-25a240b66dc6";
    const DOC_ID = "Z9AYGZ6vXp";
    const STUDENT_TABLE_ID = "grid-XCUBSLlTvd";
    const LOG_TABLE_ID = "grid-kCSxe8AMrr";

    async function loadStudents() {
        try {
            const response = await fetch(`https://coda.io/api/v1/docs/${DOC_ID}/tables/${STUDENT_TABLE_ID}/rows`, {
                headers: { "Authorization": `Bearer ${API_TOKEN}` }
            });
            const data = await response.json();
            data.items.forEach(item => {
                // '번호'와 '이름' 컬럼 ID를 실제 Coda ID로 바꿔주세요
                const phone = item.values['c-xxxxxxxxxx']; 
                const name = item.values['c-g9tuw4nP2h'];  
                studentData[phone] = name;
            });
            status.innerText = "준비 완료!";
        } catch (e) {
            status.innerText = "데이터 연결 확인 필요";
        }
    }

    function speak(text) {
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'ko-KR';
        msg.rate = 1.0;
        window.speechSynthesis.speak(msg);
    }

    function addNum(num) {
        if (input.length < 4) {
            input += num;
            updateDisplay();
            if (input.length === 4) {
                if (studentData[input]) {
                    studentNameDiv.innerText = `${studentData[input]} 학생 맞나요?`;
                } else {
                    studentNameDiv.innerText = "등록되지 않은 번호입니다.";
                }
            }
        }
    }

    function clearNum() {
        input = "";
        updateDisplay();
        studentNameDiv.innerText = "반갑습니다!";
        status.innerText = "번호를 입력해주세요.";
    }

    function updateDisplay() {
        display.innerText = input.padEnd(4, '-');
    }

    async function submitAttendance() {
        const name = studentData[input];
        if (!name) return;

        status.innerText = "전송 중...";
        spinner.style.display = "block";

        try {
            const response = await fetch(`https://coda.io/api/v1/docs/${DOC_ID}/tables/${LOG_TABLE_ID}/rows`, {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${API_TOKEN}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    "rows": [{ "cells": [
                        { "column": "학생성함", "value": name },
                        { "column": "시간", "value": new Date().toLocaleString() }
                    ]}]
                })
            });

            if (response.ok) {
                speak(`${name} 학생, 등원 확인되었습니다.`);
                status.innerText = "출결 확인 완료!";
                setTimeout(clearNum, 3000);
            } else { throw new Error(); }
        } catch (e) {
            status.innerText = "오류 발생! 다시 시도하세요.";
        } finally {
            spinner.style.display = "none";
        }
    }

    window.onload = loadStudents;
</script>
</body>
</html>

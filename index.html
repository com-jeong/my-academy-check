<script>
    // ... 상단 생략 ...
    async function loadStudents() {
        const statusDiv = document.getElementById('status');
        try {
            // 주소 끝에 타임스탬프를 붙여 브라우저 캐시 무시 유도
            const url = `https://coda.io/api/v1/docs/${DOC_ID}/tables/${STUDENT_TABLE_ID}/rows?cacheBust=${Date.now()}`;
            const response = await fetch(url, {
                method: 'GET',
                headers: { 
                    "Authorization": "Bearer " + API_TOKEN,
                    "Content-Type": "application/json"
                }
            });
            
            if (!response.ok) throw new Error("토큰 권한 오류 (Coda 설정을 확인하세요)");

            const data = await response.json();
            data.items.forEach(item => {
                const phone = String(item.values['c-g9tuw4nP2h']).trim(); 
                const name = item.values['c-HIpVFeKd32']; 
                if(phone && name) studentData[phone] = name;
            });
            
            statusDiv.style.color = "green";
            statusDiv.innerText = "● 보안 연결 성공! (명단 " + Object.keys(studentData).length + "명)";
        } catch (e) {
            statusDiv.style.color = "red";
            statusDiv.innerText = "연결 실패: " + e.message;
        }
    }
    // ... 하단 생략 ...
</script>

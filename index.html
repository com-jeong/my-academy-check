<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>픽영어 프리미엄 출결</title>
    <link rel="manifest" href="manifest.json">
    <style>
        /* 프리미엄 디자인 */
        body { 
            margin: 0; padding: 0; height: 100vh; overflow: hidden;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            display: flex; justify-content: center; align-items: center;
        }
        .container { 
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(15px);
            padding: 40px; border-radius: 40px; box-shadow: 0 20px 50px rgba(0,0,0,0.1);
            text-align: center; width: 380px; min-height: 600px; position: relative; display: flex; flex-direction: column;
            border: 1px solid rgba(255,255,255,0.4);
        }
        .title { color: #1e3a8a; font-size: 30px; font-weight: 800; margin-bottom: 35px; letter-spacing: -1px; }
        .display { 
            background: #ffffff; padding: 25px; font-size: 45px; border-radius: 20px; 
            margin-bottom: 35px; letter-spacing: 15px; min-height: 55px; 
            color: #1e3a8a; font-weight: 900; box-shadow: inset 0 2px 5px rgba(0,0,0,0.05); border: 2px solid #e2e8f0;
        }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .num-btn { 
            padding: 25px; font-size: 30px; border: none; border-radius: 20px; background: #ffffff; color: #475569; 
            cursor: pointer; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 6px rgba(0,0,0,0.02), 0 1px 3px rgba(0,0,0,0.05); font-weight: 600; outline: none;
        }
        .num-btn:active { background: #f1f5f9; transform: translateY(2px); box-shadow: none; }
        .btn-clear { color: #ef4444; background: #fff1f2; }

        #selection-area, #result-area, #error-area { display: none; flex-direction: column; flex-grow: 1; justify-content: center; align-items: center; animation: zoomIn 0.5s ease; }
        
        .name-btn { 
            width: 100%; padding: 35px; margin: 12px 0; font-size: 34px; 
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            border: none; color: white; border-radius: 25px; font-weight: 800; cursor: pointer; box-shadow: 0 10px 20px rgba(59,130,246,0.3);
        }

        .icon-circle { width: 100px; height: 100px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 50px; margin-bottom: 25px; }
        .success-bg { background: #dcfce7; color: #22c55e; }
        .error-bg { background: #fee2e2; color: #ef4444; }
        .msg-main { font-size: 32px; font-weight: 800; color: #1e293b; line-height: 1.3; }
        
        #error-number-box { 
            font-size: 45px; color: #ef4444; font-weight: 900; 
            margin: 20px 0; padding: 15px 35px; background: #fff1f2; 
            border-radius: 20px; border: 2.5px dashed #ef4444;
            letter-spacing: 12px;
        }

        #loading-overlay { position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(255,255,255,0.95); border-radius: 40px; display: flex; justify-content: center; align-items: center; font-weight: bold; color: #3b82f6; z-index: 30; font-size: 20px; }
        @keyframes zoomIn { from { opacity:0; transform: scale(0.9); } to { opacity:1; transform: scale(1); } }
    </style>
</head>
<body>
    <div class="container">
        <div id="loading-overlay">명단을 동기화하고 있습니다 ⚡</div>
        <div id="main-header">
            <div class="title">HELLO! 픽영어</div>
            <div id="display" class="display">_ _ _ _</div>
        </div>

        <div id="keypad-area" class="grid">
            <button class="num-btn" onclick="press('1')">1</button><button class="num-btn" onclick="press('2')">2</button><button class="num-btn" onclick="press('3')">3</button>
            <button class="num-btn" onclick="press('4')">4</button><button class="num-btn" onclick="press('5')">5</button><button class="num-btn" onclick="press('6')">6</button>
            <button class="num-btn" onclick="press('7')">7</button><button class="num-btn" onclick="press('8')">8</button><button class="num-btn" onclick="press('9')">9</button>
            <button class="num-btn btn-clear" onclick="clearDisp()">C</button><button class="num-btn" onclick="press('0')">0</button>
        </div>

        <div id="selection-area">
            <div id="name-buttons"></div>
            <button onclick="clearDisp()" style="margin-top:25px; color:#94a3b8; border:none; background:none; text-decoration:underline; font-size:18px;">다시 입력하기</button>
        </div>

        <div id="result-area">
            <div class="icon-circle success-bg">✔</div>
            <div id="result-message" class="msg-main"></div>
            <p id="result-sub" style="color:#94a3b8; margin-top:15px; font-size:18px;"></p>
        </div>

        <div id="error-area">
            <div class="icon-circle error-bg">✖</div>
            <div class="msg-main">미등록 번호</div>
            <div id="error-number-box"></div>
            <p style="color:#94a3b8; margin-top:15px; font-size:18px;">번호를 다시 확인해 주세요.</p>
        </div>
    </div>

    <script>
        // [설정] 웹앱 주소
        const GAS_URL = "https://script.google.com/macros/s/AKfycbyd8IddUuE4ihF-pq74uDydQOW4xNibDwkmGX2Qy473AWsiQSY99x7O0Zx8a3K0EYMjqg/exec"; 
        
        // [보안] 주소창(?key=암호)에서 암호를 가져옵니다. 코드에는 암호가 적히지 않습니다.
        const urlParams = new URLSearchParams(window.location.search);
        const MY_KEY = urlParams.get('key'); 

        let currentInput = "";
        let studentData = [];
        const greetings = ["오늘도 실력이 쑥쑥!", "영어가 즐거워지는 시간!", "기다리고 있었어요!", "오늘도 화이팅!", "반가워요!"];

        // 명단 데이터 로드 (암호를 쿼리에 포함)
        async function loadData() {
            if (!MY_KEY) {
                document.getElementById("loading-overlay").innerText = "⚠️ 접근 권한이 없습니다 (Key 누락)";
                return;
            }
            try {
                const response = await fetch(`${GAS_URL}?key=${MY_KEY}&t=${new Date().getTime()}`);
                const data = await response.json();
                if (data.error) throw new Error(data.error);
                studentData = data.items || [];
                document.getElementById("loading-overlay").style.display = "none";
            } catch (e) { 
                console.error(e);
                document.getElementById("loading-overlay").innerText = "⚠️ 동기화 실패 (암호를 확인하세요)";
            }
        }

        window.onload = () => { loadData(); setInterval(loadData, 300000); };

        function press(num) {
            if (currentInput.length < 4) {
                currentInput += num;
                updateDisplay();
                if (currentInput.length === 4) handleFullInput();
            }
        }

        function clearDisp() {
            currentInput = ""; updateDisplay();
            document.getElementById("main-header").style.display = "block";
            document.getElementById("keypad-area").style.display = "grid";
            document.getElementById("selection-area").style.display = "none";
            document.getElementById("result-area").style.display = "none";
            document.getElementById("error-area").style.display = "none";
        }

        function updateDisplay() { document.getElementById("display").innerText = currentInput.padEnd(4, "_").split("").join(" "); }

        function handleFullInput() {
            const matches = studentData.filter(s => Object.values(s.values).map(v => String(v).trim()).includes(currentInput));
            if (matches.length === 0) { showError(currentInput); return; }
            document.getElementById("keypad-area").style.display = "none";
            const nameDiv = document.getElementById("name-buttons");
            nameDiv.innerHTML = "";
            matches.forEach(m => {
                const name = Object.values(m.values).find(v => /[가-힣]/.test(v)) || "학생";
                const btn = document.createElement("button");
                btn.className = "name-btn";
                btn.innerText = name + " 입장";
                btn.onclick = () => confirmAttendance(name);
                nameDiv.appendChild(btn);
            });
            document.getElementById("selection-area").style.display = "flex";
        }

        function showError(num) {
            document.getElementById("main-header").style.display = "none";
            document.getElementById("keypad-area").style.display = "none";
            document.getElementById("error-area").style.display = "flex";
            document.getElementById("error-number-box").innerText = num;
            speak("등록되지 않은 번호입니다. 번호를 확인해 주세요.");
            setTimeout(clearDisp, 3500);
        }

        // 출결 기록 전송 (주소에 암호 포함)
        async function confirmAttendance(name) {
            const num = currentInput;
            const randomMsg = greetings[Math.floor(Math.random() * greetings.length)];
            document.getElementById("main-header").style.display = "none";
            document.getElementById("selection-area").style.display = "none";
            document.getElementById("result-area").style.display = "flex";
            document.getElementById("result-message").innerHTML = name + "님,<br>출결 완료!";
            document.getElementById("result-sub").innerText = randomMsg;
            speak(name + " 학생, " + randomMsg);
            
            try {
                // POST 요청 시에도 주소 끝에 ?key=암호 를 붙여 전송
                await fetch(`${GAS_URL}?key=${MY_KEY}`, { 
                    method: "POST", 
                    body: JSON.stringify({ name: name, number: num }) 
                });
            } catch (e) { console.error(e); }
            
            setTimeout(clearDisp, 3500);
        }

        function speak(text) {
            if (typeof SpeechSynthesisUtterance === "undefined") return;
            window.speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = "ko-KR";
            window.speechSynthesis.speak(msg);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>픽영어학원 출결</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { font-family: 'Pretendard', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f0f2f5; }
        .keypad-container { background: white; padding: 35px; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; width: 340px; position: relative; }
        .title { color: #317EFB; font-size: 26px; font-weight: bold; margin-bottom: 25px; }
        .display { background: #f8f9fa; padding: 20px; font-size: 36px; border-radius: 12px; margin-bottom: 25px; letter-spacing: 12px; min-height: 50px; border: 1px solid #eee; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        button { padding: 22px; font-size: 26px; border: 1px solid #f0f0f0; border-radius: 15px; background: white; cursor: pointer; transition: 0.1s; }
        button:active { background: #e9ecef; transform: scale(0.95); }
        .btn-confirm { grid-column: span 3; background: #317EFB; color: white; border: none; margin-top: 20px; font-weight: bold; padding: 25px; border-radius: 15px; font-size: 26px; }
        
        /* 모달 스타일 */
        #modal { display: none; position: absolute; top:0; left:0; width:100%; height:100%; background: white; border-radius: 25px; z-index: 20; flex-direction: column; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; }
        .modal-title { font-size: 20px; color: #333; margin-bottom: 20px; font-weight: bold; }
        .name-btn { width: 100%; padding: 25px; margin: 10px 0; font-size: 28px; background: #f1f8ff; border: 2px solid #317EFB; color: #317EFB; border-radius: 15px; font-weight: bold; }
        #loading-overlay { position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(255,255,255,0.9); border-radius: 25px; display: flex; justify-content: center; align-items: center; font-weight: bold; color: #317EFB; z-index: 30; }
    </style>
</head>
<body>
    <div class="keypad-container">
        <div id="loading-overlay">학생 명단을 불러오는 중...</div>
        
        <div id="modal">
            <div class="modal-title">이름을 선택하세요</div>
            <div id="name-list" style="width: 100%;"></div>
            <button onclick="closeModal()" style="margin-top:20px; font-size:16px; border:none; color:#666; background:none;">취소하기</button>
        </div>

        <div class="title">반갑습니다!</div>
        <div id="display" class="display">_ _ _ _</div>
        <div class="grid">
            <button onclick="press('1')">1</button><button onclick="press('2')">2</button><button onclick="press('3')">3</button>
            <button onclick="press('4')">4</button><button onclick="press('5')">5</button><button onclick="press('6')">6</button>
            <button onclick="press('7')">7</button><button onclick="press('8')">8</button><button onclick="press('9')">9</button>
            <button onclick="clearDisp()" style="color:#dc3545">C</button><button onclick="press('0')">0</button>
        </div>
        <button onclick="submitCheck()" class="btn-confirm">확인</button>
    </div>

    <script>
        const GAS_URL = "원장님의_GAS_URL_입력"; 
        let currentInput = "";
        let studentData = [];

        window.onload = async () => {
            try {
                const response = await fetch(GAS_URL);
                const data = await response.json();
                studentData = data.items;
                document.getElementById("loading-overlay").style.display = "none";
            } catch (e) { document.getElementById("loading-overlay").innerText = "오류 발생"; }
        };

        function press(num) { if (currentInput.length < 4) { currentInput += num; updateDisplay(); } }
        function clearDisp() { currentInput = ""; updateDisplay(); }
        function updateDisplay() { document.getElementById("display").innerText = currentInput.padEnd(4, "_").split("").join(" "); }
        function closeModal() { document.getElementById("modal").style.display = "none"; clearDisp(); }

        async function submitCheck() {
            if (currentInput.length < 4) return;
            const matches = studentData.filter(s => s.values["c-g9tuw4nP2h"] === currentInput);
            
            if (matches.length === 0) {
                alert("등록되지 않은 번호입니다.");
                clearDisp();
            } else if (matches.length === 1) {
                processAttendance(matches[0].values["c-HIpVFeKd32"]);
            } else {
                showModal(matches);
            }
        }

        function showModal(matches) {
            const listDiv = document.getElementById("name-list");
            listDiv.innerHTML = "";
            matches.forEach(m => {
                const name = m.values["c-HIpVFeKd32"];
                const btn = document.createElement("button");
                btn.className = "name-btn";
                btn.innerText = name;
                btn.onclick = () => { processAttendance(name); closeModal(); };
                listDiv.appendChild(btn);
            });
            document.getElementById("modal").style.display = "flex";
        }

        async function processAttendance(name) {
            try {
                await fetch(GAS_URL, { method: "POST", body: JSON.stringify({ name: name }) });
                alert(name + " 학생, 등원 확인!"); //
            } catch (e) { alert("연결 오류"); }
            clearDisp();
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>학원 출결 시스템 - 최종연결</title>
    <style>
        :root { --primary-color: #4A90E2; --text-color: #2D3436; }
        body { font-family: 'Pretendard', sans-serif; background: #f5f7fa; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .keypad-container { background: white; padding: 40px; border-radius: 30px; box-shadow: 0 20px 50px rgba(0,0,0,0.15); width: 400px; text-align: center; }
        .student-info { height: 40px; margin-bottom: 10px; font-size: 20px; font-weight: 700; color: var(--primary-color); }
        .display { background: #F1F3F5; height: 80px; border-radius: 20px; margin-bottom: 30px; display: flex; justify-content: center; align-items: center; font-size: 40px; font-weight: 800; letter-spacing: 15px; border: 2px solid #E9ECEF; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        button { height: 80px; border: 1px solid #eee; border-radius: 20px; background: #fff; font-size: 28px; font-weight: 700; cursor: pointer; }
        .btn-ok { background: var(--primary-color); color: white; grid-column: span 2; }
        #status { margin-top: 25px; font-size: 14px; color: #666; font-weight: bold; }
    </style>
</head>
<body>
<div class="keypad-container">
    <div id="studentName" class="student-info">데이터 연결 중...</div>
    <div id="display" class="display">----</div>
    <div class="grid">
        <button onclick="addNum('1')">1</button><button onclick="addNum('2')">2</button><button onclick="addNum('3')">3</button>
        <button onclick="addNum('4')">4</button><button onclick="addNum('5')">5</button><button onclick="addNum('6')">6</button>
        <button onclick="addNum('7')">7</button><button onclick="addNum('8')">8</button><button onclick="addNum('9')">9</button>
        <button onclick="clearNum()" style="color:red">C</button><button onclick="addNum('0')">0</button>
        <button class="btn-ok" onclick="submitAttendance()">확인</button>
    </div>
    <div id="status">연결 시도 중...</div>
</div>

<script>
    let input = "";
    let studentData = {};
    
    // 원장님 정보 (복사해서 사용)
    const API_TOKEN = "a6888320-2534-4d7d-ae99-0dcfaba87910";
    const DOC_ID = "Z9AYGZ6vXp";
    const STUDENT_TABLE_ID = "grid-kCSxe8AMrr"; 
    const LOG_TABLE_ID = "grid-XCUBSLlTvd";

// loadStudents 함수 부분만 이 코드로 살짝 바꿔보세요
async function loadStudents() {
    const statusDiv = document.getElementById('status');
    const nameDiv = document.getElementById('studentName');
    try {
        const response = await fetch(`https://coda.io/api/v1/docs/${DOC_ID}/tables/${STUDENT_TABLE_ID}/rows`, {
            headers: { "Authorization": "Bearer " + API_TOKEN }
        });
        
        if (!response.ok) {
            // 401: 토큰 틀림, 403: 권한 없음, 404: 테이블 ID 틀림
            statusDiv.innerText = `연결 오류: 코드 ${response.status} 발생`;
            return;
        }

        const data = await response.json();
        data.items.forEach(item => {
            const phone = String(item.values['c-g9tuw4nP2h']).trim(); 
            const name = item.values['c-HIpVFeKd32'];
            if(phone && name) studentData[phone] = name;
        });
        statusDiv.style.color = "green";
        statusDiv.innerText = `● 연결 성공 (학생 ${Object.keys(studentData).length}명)`;
        nameDiv.innerText = "반갑습니다!";
    } catch (e) {
        statusDiv.innerText = "네트워크 차단: 인터넷이나 보안 설정을 확인하세요.";
    }
}

    function addNum(num) {
        if (input.length < 4) {
            input += num;
            document.getElementById('display').innerText = input.padEnd(4, '-');
            if (input.length === 4) {
                const name = studentData[input];
                document.getElementById('studentName').innerText = name ? name + " 학생 맞나요?" : "등록되지 않은 번호입니다.";
            }
        }
    }

    function clearNum() {
        input = "";
        document.getElementById('display').innerText = "----";
        document.getElementById('studentName').innerText = "반갑습니다!";
    }

    async function submitAttendance() {
        const name = studentData[input];
        if (!name) return;
        document.getElementById('status').innerText = "기록 중...";
        try {
            const response = await fetch(`https://coda.io/api/v1/docs/${DOC_ID}/tables/${LOG_TABLE_ID}/rows`, {
                method: "POST",
                headers: { 
                    "Authorization": "Bearer " + API_TOKEN, 
                    "Content-Type": "application/json" 
                },
                body: JSON.stringify({
                    "rows": [{ "cells": [
                        { "column": "학생", "value": name }, //
                        { "column": "Date and time", "value": new Date().toLocaleString() }
                    ]}]
                })
            });
            if (response.ok) {
                const msg = new SpeechSynthesisUtterance(name + " 학생, 확인되었습니다.");
                msg.lang = 'ko-KR';
                window.speechSynthesis.speak(msg);
                document.getElementById('status').innerText = "출결 확인 완료!";
                setTimeout(clearNum, 3000);
            }
        } catch (e) {
            document.getElementById('status').innerText = "기록 전송 실패";
        }
    }
    window.onload = loadStudents;
</script>
</body>
</html>

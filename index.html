<script>
    let input = "";
    let studentData = {};
    
    // 원장님의 정보
    const API_TOKEN = "여기에_제한_없는_새_토큰_입력"; 
    const DOC_ID = "Z9AYGZ6vXp";
    const STUDENT_TABLE_ID = "grid-kCSxe8AMrr"; // DB 학생
    const LOG_TABLE_ID = "grid-XCUBSLlTvd";     // DB 출결로그

    async function loadStudents() {
        const statusDiv = document.getElementById('status');
        const nameDiv = document.getElementById('studentName');
        try {
            // 주소 끝에 타임스탬프를 붙여 브라우저가 예전 에러 기록을 무시하게 함
            const url = `https://coda.io/api/v1/docs/${DOC_ID}/tables/${STUDENT_TABLE_ID}/rows?cb=${Date.now()}`;
            const response = await fetch(url, {
                headers: { "Authorization": "Bearer " + API_TOKEN }
            });
            
            if (!response.ok) {
                statusDiv.innerText = `연결 실패: 토큰이나 권한을 확인하세요. (코드 ${response.status})`;
                return;
            }

            const data = await response.json();
            data.items.forEach(item => {
                const phone = String(item.values['c-g9tuw4nP2h']).trim(); // 출결번호
                const name = item.values['c-HIpVFeKd32']; // 학생이름
                if(phone && name) studentData[phone] = name;
            });
            
            statusDiv.style.color = "green";
            statusDiv.innerText = `● 준비 완료! (학생 ${Object.keys(studentData).length}명 연결됨)`;
            nameDiv.innerText = "반갑습니다!";
        } catch (e) {
            statusDiv.style.color = "red";
            statusDiv.innerText = "네트워크 차단됨: 브라우저 보안 설정을 확인하세요.";
        }
    }
    // ... 나머지 함수들(addNum, clearNum, submitAttendance)은 기존과 동일하게 유지 ...
    window.onload = loadStudents;
</script>
